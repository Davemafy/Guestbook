name: train-real-data-candidate

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/train-real-data-candidate.yml"
      - "scripts/train_candidate.py"
      - "scripts/export_training_data.mjs"
      - "src/ai/trainingData.ts"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export bundled synthetic cases
        run: node scripts/export_training_data.mjs > /tmp/guestbook-training.json
      - name: Install training dependencies
        run: pip install --disable-pip-version-check numpy pandas pyarrow requests
      - name: Train candidate with external train partitions
        run: python scripts/train_candidate.py
      - name: Promote candidate when evidence gates pass
        run: |
          python - <<'PY'
          import json, shutil, sys
          report=json.load(open("candidate-model/candidate-report.json"))
          gates=[
            report["synthetic_frozen"]["precision"] >= 0.90,
            report["synthetic_frozen"]["f1"] >= 0.88,
            report["massive_test"]["en-US"]["mapped_label_hit_rate"] >= 0.85,
            report["massive_test"]["sw-KE"]["mapped_label_hit_rate"] >= 0.85,
            report["nairobi_weak_heldout"]["overall"]["hit_rate"] >= 0.90,
          ]
          if not all(gates):
              print("Candidate failed promotion gates", gates)
              sys.exit(1)
          shutil.copyfile("candidate-model/pretrained-candidate.ts","src/ai/pretrained.ts")
          print("Candidate passed all promotion gates")
          PY
          git config user.name "guestbook-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/ai/pretrained.ts
          git commit -m "model: promote real-data multilingual candidate"
          git pull --rebase origin main
          git push
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: guestbook-real-data-candidate
          path: candidate-model/
          retention-days: 7
